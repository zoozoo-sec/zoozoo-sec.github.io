<!DOCTYPE html>
<html lang="en">
  <head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WXG06FBJV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-1WXG06FBJV');
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SEO Meta Tags -->
    <meta name="description" content="{{ page.description | default: 'Portfolio - A showcase of my Cybersecurity Blogs, skills, and writeups.' }}">
    <meta name="keywords" content="{{ page.keywords | default: 'Sarvesh Aadhithya, zoozoo, zoozoo-sec, Portfolio, Cybersecurity, Web Security, Penetration Testing, Binary Exploitation, Pwning, Reverse Engineering' }}">
    <meta name="author" content="{{ page.author | default: 'Sarvesh Aadhithya' }}">

    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:site_name" content="zoozoo">
    <meta property="og:title" content="{{ page.og_title | default: page.title | default: 'Sarvesh Aadhithya' }}">
    <meta property="og:description" content="{{ page.og_description | default: page.description | default: 'Explore my cybersecurity blogs, CTF writeups, and research.' }}">
    <meta property="og:image" content="{{ page.og_image | default: 'https://zoozoo-sec.github.io/assets/img/profile.png' }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}">

    <!-- Twitter/X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@_zoozoo">
    <meta name="twitter:creator" content="@_zoozoo">
    <meta name="twitter:title" content="{{ page.og_title | default: page.title | default: 'Sarvesh Aadhithya' }}">
    <meta name="twitter:description" content="{{ page.og_description | default: page.description | default: 'Explore my cybersecurity blogs, CTF writeups, and research.' }}">
    <meta name="twitter:image" content="{{ page.og_image | default: 'https://zoozoo-sec.github.io/assets/img/profile.png' }}">

    <meta name="google-site-verification" content="v69gJXqJz6iGyPYD6kQSJvTWtsLbLuzwu6zs4Yqd2mc" />

    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Structured Data (Google rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "name": "Sarvesh Aadhithya",
          "alternateName": "zoozoo",
          "url": "{{ '/' | absolute_url }}",
          "sameAs": [
            "https://x.com/_zoozoo/",
            "https://github.com/zoozoo-sec"
          ],
          "jobTitle": "Low-level Security Researcher"
        },
        {
          "@type": "WebSite",
          "name": "Sarvesh Aadhithya's Portfolio",
          "url": "{{ '/' | absolute_url }}",
          "author": { "@type": "Person", "name": "Sarvesh Aadhithya" }
        }
      ]
    }
    </script>

    <!-- Title and Favicon -->
    <title>{{ page.title | default: 'Sarvesh Aadhithya' }}</title>
    <link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/mediaqueries.css' | relative_url }}" />
  </head>

  <body{% if page.url == '/' %} data-particle-game="on"{% endif %}>
    <canvas id="bg-particles"></canvas>
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}
    <!-- Scripts -->
    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/particles.js' | relative_url }}"></script>
  </body>
</html>
